name: Daily Baseball Data Auto Sync

on:
  schedule:
    # 매일 한국 시각 자정(00:00 KST = 15:00 UTC)에 실행
    - cron: '0 15 * * *'
  workflow_dispatch: # 깃허브 웹에서 'Run workflow' 버튼으로 언제든 즉시 실행 가능

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 3.12 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true

      - name: 일일 야구 데이터 자동 수집 및 세이버메트릭스 갱신 실행
        run: |
          python scripts/daily_sync.py || true

      - name: 갱신된 데이터 및 폴더 커밋 & 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add exports/ sports_data.db || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto sync baseball data [skip ci]" && git push || echo "Push skipped")
